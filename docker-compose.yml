name: ledgr

services:
  db:
    image: postgres:16-alpine
    container_name: ledgr-db
    environment:
      POSTGRES_USER: ledgr
      POSTGRES_PASSWORD: ledgr
      POSTGRES_DB: ledgr
    ports:
      # Loopback only (the demo credentials are public). Both address families:
      # on Windows `localhost` tries ::1 first and stalls ~8s per connection if
      # only 127.0.0.1 is published.
      - "127.0.0.1:5433:5432"
      - "[::1]:5433:5432"
    volumes:
      - ledgr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgr -d ledgr"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations, then seeds a realistic chart of accounts and
  # transaction history if the ledger is empty. Runs before the API starts.
  migrate:
    build:
      context: ./backend
    container_name: ledgr-migrate
    environment:
      DATABASE_URL: postgresql+psycopg://ledgr:ledgr@db:5432/ledgr
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && python -m app.scripts.seed --if-empty"
    restart: "no"

  api:
    build:
      context: ./backend
    container_name: ledgr-api
    environment:
      DATABASE_URL: postgresql+psycopg://ledgr:ledgr@db:5432/ledgr
      ENVIRONMENT: docker
      # Optional, from your shell or a .env file next to this compose file. Unset = off.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      SIGNUP_TOKEN: ${SIGNUP_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      # Browser origins allowed to call the API with credentials (the session cookie).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        # Baked at build time: the SPA is static, so the API origin has to be
        # known when the bundle is produced.
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: ledgr-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  ledgr-pgdata:
